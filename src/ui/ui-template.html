<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Duplicate Finder</title>
    <link rel="stylesheet" href="ui-styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 JavaScript Duplicate Finder</h1>
            <p>Intelligent code duplication detection</p>
            <button class="refresh-btn" onclick="location.reload()">🔄 Refresh Analysis</button>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="number">{{filesScanned}}</div>
                <div class="label">Files Scanned</div>
            </div>
            <div class="stat-card">
                <div class="number">{{functionsFound}}</div>
                <div class="label">Functions Found</div>
            </div>
            <div class="stat-card">
                <div class="number">{{groupsFound}}</div>
                <div class="label">Duplicate Groups</div>
            </div>
            <div class="stat-card">
                <div class="number">{{duplicatesFound}}</div>
                <div class="label">Duplicate Pairs</div>
            </div>
            <div class="stat-card">
                <div class="number">{{threshold}}%</div>
                <div class="label">Threshold</div>
            </div>
        </div>
        
        <div id="results">
            <!-- Results will be injected here -->
        </div>
    </div>
    
    <script>
        // Handed out by the server that rendered this page; /open-file
        // rejects requests that don't echo it back, so another site the
        // user has open can't drive the endpoint.
        const OPEN_FILE_TOKEN = "{{openFileToken}}";

        function openFile(filePath, line) {
            const query = new URLSearchParams({ path: filePath, line: line, token: OPEN_FILE_TOKEN });
            fetch(`/open-file?${query}`)
                .then(response => {
                    if (response.ok) {
                        console.log('File opened in VSCode');
                    } else {
                        console.error('Failed to open file');
                    }
                })
                .catch(error => console.error('Error:', error));
        }

        // Delegated click handling. File paths reach the page as data-*
        // attributes and are read back as text here, so a path is never
        // parsed as markup or as code - see renderGroupMember().
        document.getElementById('results').addEventListener('click', (event) => {
            const clicked = event.target.closest('.clickable');
            if (!clicked) return;
            const info = clicked.closest('.function-info');
            if (!info) return;
            openFile(info.dataset.path, Number(info.dataset.line) || 1);
        });
    </script>
</body>
</html>
