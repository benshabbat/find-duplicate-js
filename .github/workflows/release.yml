# Publishes to npm whenever a version tag (v*) is pushed, so tagging and
# publishing can't drift apart (v1.7.0 was once published without a tag).
#
# One-time setup required on npmjs.com (no token/secret needed after it):
#   Package "find-duplicate-js" -> Settings -> Publishing access ->
#   Trusted Publisher -> GitHub Actions:
#     repository: benshabbat/find-duplicate-js
#     workflow:   release.yml
# The `id-token: write` permission below lets npm authenticate this workflow
# via OIDC (trusted publishing) and generate provenance attestations.
#
# Release flow:
#   npm version minor        # bumps package.json + creates the vX.Y.Z tag
#   git push --follow-tags   # pushing the tag triggers this workflow
name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
